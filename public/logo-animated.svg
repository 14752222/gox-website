  <style>
    .tile { animation: gtile 4.85s ease-in-out infinite; }
    .p {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        gpop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) var(--d) both,
        gbreathe 2.6s ease-in-out 2.45s infinite;
    }
    @keyframes gpop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes gbreathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.78; }
    }
    @keyframes gtile {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.025); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile, .p { animation: none; }
    }
  </style>
